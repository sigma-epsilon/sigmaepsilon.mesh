version: 2.1

orbs:
  codecov: codecov/codecov@6.1.0

executors:
  my-executor:
    docker:
      - image: cimg/python:3.12

  executor-python-312:
    docker:
      - image: cimg/python:3.12

run_tests_template: &run_tests_template
  steps:
    - checkout
    - run:
        name: Refresh packages
        command: sudo apt-get update
    - run:
        name: Install xvfb for offline rendering
        command: sudo apt-get install libgl1-mesa-glx xvfb
    - run:
        name: Install uv
        command: pip install uv
    - run:
        name: Create lock file
        command: uv lock
    - run:
        name: Install project
        command: uv sync --no-default-groups --group test
    - run:
        name: Run tests and generate coverage report
        command: |
          chmod +x ./run_tests_with_coverage.sh
          ./run_tests_with_coverage.sh
    - store_artifacts:
        name: Store coverage report as artifact
        path: htmlcov/
    - codecov/upload
    - store_test_results:
        name: Store test results
        path: test-results

jobs:
  run_tests:
    executor: executor-python-312
    <<: *run_tests_template

  deploy_to_pypi:
    executor: my-executor
    parameters:
      test:
        type: boolean
        default: true  # Default to TestPyPI
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Create lock file
          command: uv lock
      - run:
          name: Build project
          command: |
            uv sync
            uv build
      - run:
          name: Deploy to PyPI
          command: |
            if [ "<< parameters.test >>" = "true" ]; then
              echo "Deploying to TestPyPI"
              uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/ --token $TEST_PYPI_TOKEN
            else
              echo "Deploying to PyPI"
              uv publish --check-url https://pypi.org/simple/ --token $PYPI_TOKEN
            fi

workflows:
  test_and_deploy:
    jobs:
      - run_tests:
          name: Run tests and generate coverage report

      - deploy_to_pypi:
          name: Deploy to TestPyPI
          test: true
          context:
            - TestPyPI deploy
          requires:
            - Run tests and generate coverage report
          filters:
            branches:
              only:
                - test

      - deploy_to_pypi:
          name: Deploy to PyPI
          test: false
          context:
            - PyPI deploy
          requires:
            - Run tests and generate coverage report
          filters:
            branches:
              only:
                - main
