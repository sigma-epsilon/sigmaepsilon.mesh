version: 2.1

orbs:
  codecov: codecov/codecov@6.1.0

executors:
  my-executor:
    docker:
      - image: cimg/python:3.12

  executor-python-312:
    docker:
      - image: cimg/python:3.12

jobs:
  run_tests:
    executor: executor-python-312
    parameters:
      python:
        type: string
      resolution:
        description: uv resolution strategy; lowest-direct checks the minimum versions in pyproject.toml.
        type: enum
        enum: ["highest", "lowest-direct"]
        default: "highest"
    steps:
      - checkout
      - run:
          name: Refresh packages
          command: sudo apt-get update
      - run:
          name: Install xvfb for offline rendering
          command: sudo apt-get install libgl1-mesa-glx xvfb
      - run:
          name: Install uv
          command: pip install uv
      - when:
          condition:
            equal: ["highest", << parameters.resolution >>]
          steps:
            - run:
                name: Install project
                command: uv sync --locked --no-default-groups --group test --python << parameters.python >>
      - when:
          condition:
            equal: ["lowest-direct", << parameters.resolution >>]
          steps:
            - run:
                name: Install project with the lowest direct dependencies
                command: uv sync --resolution lowest-direct --no-default-groups --group test --python << parameters.python >>
      - run:
          name: Run tests and generate coverage report
          command: xvfb-run -a uv run --no-sync pytest tests --cov=src --cov-config=.coveragerc --cov-report=xml --cov-report=html
      - when:
          condition:
            and:
              - equal: ["3.12", << parameters.python >>]
              - equal: ["highest", << parameters.resolution >>]
          steps:
            - store_artifacts:
                name: Store coverage report as artifact
                path: htmlcov/
            - codecov/upload
      - store_test_results:
          name: Store test results
          path: test-results

  deploy_to_pypi:
    executor: my-executor
    parameters:
      test:
        type: boolean
        default: true  # Default to TestPyPI
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Create lock file
          command: uv lock
      - run:
          name: Build project
          command: |
            uv sync
            uv build
      - run:
          name: Deploy to PyPI
          command: |
            if [ "<< parameters.test >>" = "true" ]; then
              echo "Deploying to TestPyPI"
              uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/ --token $TEST_PYPI_TOKEN
            else
              echo "Deploying to PyPI"
              uv publish --check-url https://pypi.org/simple/ --token $PYPI_TOKEN
            fi

workflows:
  test_and_deploy:
    jobs:
      - run_tests:
          matrix:
            parameters:
              python: ["3.10", "3.12", "3.13"]

      - run_tests:
          name: run_tests_lowest
          python: "3.10"
          resolution: "lowest-direct"

      - deploy_to_pypi:
          name: Deploy to TestPyPI
          test: true
          context:
            - TestPyPI deploy
          requires:
            - run_tests
            - run_tests_lowest
          filters:
            branches:
              only:
                - test

      - deploy_to_pypi:
          name: Deploy to PyPI
          test: false
          context:
            - PyPI deploy
          requires:
            - run_tests
            - run_tests_lowest
          filters:
            branches:
              only:
                - main
