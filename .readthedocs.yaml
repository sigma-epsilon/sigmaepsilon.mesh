version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    # for off-screen rendering with PyVista, see docs/source/conf.py
    - libgl1
    - xvfb
  jobs:
    post_create_environment:
      # Install uv
      # https://docs.astral.sh/uv/getting-started/installation/
      - pip install uv
    post_install:
      # Install dependencies with the 'docs' dependency group
      # https://docs.astral.sh/uv/concepts/projects/dependencies/#dependency-groups
      # VIRTUAL_ENV needs to be set manually for now.
      # See https://github.com/readthedocs/readthedocs.org/pull/11152/
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH uv sync --active --no-default-groups --group docs

sphinx:
  configuration: docs/source/conf.py
