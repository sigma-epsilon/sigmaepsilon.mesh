[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigmaepsilon.mesh"
version = "3.3.0"
description = "A Python package to build, manipulate and analyze polygonal meshes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Bence Balogh", email = "bencebalogh@sigmaepsilon.com" },
]
maintainers = [
    { name = "Bence Balogh", email = "bencebalogh@sigmaepsilon.com" },
]
keywords = [
    "computational geometry", "polygonal mesh", "polygonal mesh analysis",
    "polygonal mesh manipulation", "polygonal mesh generation", "polygonal mesh visualization",
    "polygonal mesh conversion", "polygonal mesh export", "polygonal mesh import",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "sigmaepsilon-core>=1.2.0",
    "sigmaepsilon-deepdict>=3.0.0",
    "sigmaepsilon-math>=2.6.0",
    "numpy>=1.23",
    "scipy>=1.9",
    "numba>=0.56.2",
    "sympy>=1.9",
    "awkward>=2.0.0",
    "packaging>=20.0",
    "sectionproperties>=3.1.2",
    "meshio>=5.3.5",
]

[project.urls]
Homepage = "https://github.com/sigma-epsilon/sigmaepsilon.mesh"
Repository = "https://github.com/sigma-epsilon/sigmaepsilon.mesh"
Documentation = "https://sigmaepsilonmesh.readthedocs.io/en/latest/"

[tool.hatch.build.targets.wheel]
packages = ["src/sigmaepsilon"]

[dependency-groups]
dev = [
    "networkx>=3.0",
    "matplotlib>=3.8.3",
    "vtk>=9.3.0",
    "pyvista>=0.44.2",
    "pythreejs>=2.4.2",
    "ipyvtklink>=0.2.3",
    "ipykernel>=6.29.2",
    "pandas>=2.2.0",
    "plotly>=5.19.0",
    "autopep8>=2.0.4",
    "awkward>=2.6.1",
    "pyarrow>=15.0.0",
    "asciitree>=0.3.3",
    "numpy>=1.22.2",
    "pillow>=10.3.0",
    "tornado>=6.3.3",
    "fonttools>=4.43.0",
    "ipython>=8.10.0",
    "setuptools>=65.5.1",
    "black>=24.8.0",
]
test = [
    "pyvista>=0.44.2",
    "pytest>=8.0.1",
    "pytest-cov>=4.1.0",
    "coverage>=7.4.1",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "k3d>=2.16.1",
    "networkx>=3.0",
    "pillow>=10.3.0",
    "fonttools>=4.43.0",
    "testbook>=0.4.2",
    "plotly>=5.24.1",
]
docs = [
    "ipython>=8.21.0,<9.0.0",
    "myst-parser>=2.0.0,<3.0.0",
    "nbsphinx>=0.9.3,<0.10.0",
    "sphinx-gallery>=0.15.0,<0.16.0",
    "sphinx-copybutton>=0.5.2,<0.6.0",
    "sphinxcontrib-bibtex>=2.6.2,<3.0.0",
    "nbsphinx-link>=1.3.0,<2.0.0",
    "sphinxcontrib-svg2pdfconverter>=1.2.2,<2.0.0",
    "sphinx-design>=0.5.0,<0.6.0",
    "sphinx-inline-tabs>=2023.4.21,<2024.0.0",
    "pydata-sphinx-theme>=0.15.2,<0.16.0",
    "sphinx-plotly-directive>=0.1.3,<0.2.0",
    "pyvista>=0.44.2",
    "pandas>=2.2.0,<3.0.0",
    "matplotlib>=3.8.3,<4.0.0",
    "plotly>=5.19.0,<6.0.0",
    "k3d>=2.16.1,<3.0.0",
    "setuptools>=65.5.1",
    "numpy>=1.22.2",
    "pillow>=10.3.0",
    "tornado>=6.3.3",
    "fonttools>=4.43.0",
]
